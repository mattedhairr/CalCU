<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalCU by YouDO</title>
    <meta name="description" content="Press Alt + C anywhere on Windows to summon the GATE virtual scientific calculator over your PDFs and lectures. CalCU by YouDO, for GATE, ESE and PSU aspirants." />
    <meta property="og:title" content="CalCU by YouDO" />
    <meta property="og:description" content="Press Alt + C anywhere on Windows to summon the GATE virtual scientific calculator over your PDFs and lectures." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Apply the saved or system theme before first paint (see useTheme.ts).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('calcu-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.className = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
